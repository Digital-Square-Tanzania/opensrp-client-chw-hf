indicators:
  #  # WANAUME
  #  - key: hts-1-2-9-ME
  #    grouping: HTS
  #    description: Idadi ya wateja wapya waliosajiliwa katika kipindi cha ripoti Umri 2-9
  #    indicatorQuery: ' SELECT count(DISTINCT ekbms.entity_id) as count FROM ec_kvp_bio_medical_services ekbms INNER JOIN ec_family_member efm ON efm.base_entity_id = ekbms.entity_id INNER JOIN ec_kvp_register ekr ON efm.base_entity_id = ekr.id WHERE client_status = ''new_visit'' AND ekr.client_group =''pwid'' AND (date(''now'')-date(efm.dob))<10 AND (efm.gender=''Male'') AND date((substr(''%s'', 1, 4) || ''-'' || substr(''%s'', 6, 2) || ''-'' || ''01'')) = date(substr(ekbms.kvp_visit_date, 7, 4) || ''-'' || substr(ekbms.kvp_visit_date, 4, 2) || ''-'' || ''01'')'
  #  - key: hts-1-10-14-ME
  #    grouping: HTS
  #    description: Idadi ya wateja wapya waliosajiliwa katika kipindi cha ripoti Umri 10-14
  #    indicatorQuery: ' SELECT count(DISTINCT ekbms.entity_id) as count FROM ec_kvp_bio_medical_services ekbms INNER JOIN ec_family_member efm ON efm.base_entity_id = ekbms.entity_id INNER JOIN ec_kvp_register ekr ON efm.base_entity_id = ekr.id WHERE client_status = ''new_visit'' AND ekr.client_group =''pwid'' AND (date(efm.dob, ''+10 years'') <= date(''now'')) AND (date(efm.dob, ''+15 years'') > date(''now'')) AND (efm.gender=''Male'') AND date((substr(''%s'', 1, 4) || ''-'' || substr(''%s'', 6, 2) || ''-'' || ''01'')) = date(substr(ekbms.kvp_visit_date, 7, 4) || ''-'' || substr(ekbms.kvp_visit_date, 4, 2) || ''-'' || ''01'')'
  - key: hts-1->=15-ME
    grouping: HTS
    description: Idadi ya wateja wapya waliosajiliwa katika kipindi cha ripoti Umri >=15
    indicatorQuery: " SELECT count(DISTINCT ekbms.id) as count FROM ec_hts_register ekbms 
                      INNER JOIN ec_family_member efm ON efm.base_entity_id = ekbms.id 
                      WHERE efm.gender='Male' 
                      AND (date('now')- date(efm.dob))>=15 
                      AND date((substr('%s', 1, 4) || '-' || substr('%s', 6, 2) || '-' || '01')) = 
                      date(substr(strftime('%Y-%m-%d', datetime(ekbms.last_interacted_with / 1000, 'unixepoch', 'localtime')), 1, 4) 
                      ||'-' || substr(strftime('%Y-%m-%d', datetime(ekbms.last_interacted_with / 1000, 'unixepoch', 'localtime')), 6, 2) ||'-' || '01') "
