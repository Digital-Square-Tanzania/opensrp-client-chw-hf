indicators:
  #Wanaume
  - key: hts-monthly-1-<1-ME
    grouping: HTS
    description: Idadi ya wateja wapya waliosajiliwa katika kipindi cha ripoti Umri 2-9
    indicatorQuery: " SELECT count(DISTINCT ehs.entity_id) as count FROM ec_hts_services ehs 
                      INNER JOIN ec_family_member efm ON efm.base_entity_id = ehs.entity_id
                      WHERE efm.gender='Male' 
					  AND ehs.hts_has_post_test_counselling_been_provided = 'yes'
                      AND (date('now')- date(efm.dob))<1
                      AND date((substr('2025-01-01', 1, 4) || '-' || substr('2025-01-30', 6, 2) || '-' || '01')) = 
                      date(substr(strftime('%Y-%m-%d', datetime(ehs.last_interacted_with / 1000, 'unixepoch', 'localtime')), 1, 4) 
                      ||'-' || substr(strftime('%Y-%m-%d', datetime(ehs.last_interacted_with / 1000, 'unixepoch', 'localtime')), 6, 2) ||'-' || '01') "
