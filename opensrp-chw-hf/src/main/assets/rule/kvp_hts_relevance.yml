---
name: step1_testing_site
description: testing_site relevance
priority: 1
condition: "step1_tested_hiv.equals('yes') && !step1_previous_hiv_testing_method.isEmpty() && !step1_previous_hiv_testing_method.equals('not_tested') && !step1_previous_hiv_testing_method.equals('hivst')"
actions:
  - "isRelevant = true"
---
name: step1_hiv_status
description: hiv_testing_results relevance
priority: 1
condition: "step1_tested_hiv.equals('yes') && !step1_previous_hiv_testing_method.isEmpty() && !step1_previous_hiv_testing_method.equals('not_tested') && !step1_previous_hiv_testing_method.equals('hivst')"
actions:
  - "isRelevant = true"
---
name: step1_testing_approach
description: testing_approach relevance
priority: 1
condition: "!step1_tested_hiv.isEmpty() && step1_tested_hiv.equals('yes')"
actions:
  - "isRelevant = true"
---
name: step1_previous_hiv_testing_method
description: previous_hiv_testing_method relevance
priority: 1
condition: "step1_tested_hiv.equals('yes')"
actions:
  - "isRelevant = true"
---
name: step1_ctc_services
description: ctc_services relevance
priority: 1
condition: "step1_hiv_status.equals('positive') || step1_hiv_status.equals('known_positive')"
actions:
  - "isRelevant = true"
---
name: step1_ctc_number
description: ctc_number relevance
priority: 1
condition: "(step1_hiv_status.equals('positive') || step1_hiv_status.equals('known_positive')) && (step1_ctc_services.equals('enrolled_but_not_on_arv') || step1_ctc_services.equals('enrolled_and_on_arv'))"
actions:
  - "isRelevant = true"

---
name: step1_enroll_prep_services
description: enroll_prep_services relevance
priority: 1
condition: "step1_hiv_status.equals('negative')"
actions:
  - "isRelevant = true"
---
name: step1_tested_hiv
description: tested_hiv relevance
priority: 1
condition: "global_editing_saved_hts.equals('yes') || global_hiv_status.equalsIgnoreCase('') || global_hiv_status.equalsIgnoreCase('negative') || global_hiv_status.equalsIgnoreCase('inconclusive') || global_hiv_status.equalsIgnoreCase('refused_results')"
actions:
  - "isRelevant = true"
